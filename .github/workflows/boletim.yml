name: Boletim diário

on:
  schedule:
    # 11:00 UTC = 08:00 em Brasília, de segunda a sexta.
    # O agendador do GitHub Actions atrasa em horários de pico; trate o
    # horário como aproximado.
    - cron: "0 11 * * 1-5"
  workflow_dispatch:        # permite disparar manualmente pela aba Actions

permissions:
  contents: write           # necessário para commitar o site e o histórico

concurrency:
  group: boletim
  cancel-in-progress: false # nunca abortar uma execução que já está gravando

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Gerar boletim
        env:
          PROVEDOR_IA: ${{ vars.PROVEDOR_IA || 'gemini' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODELO: ${{ vars.GEMINI_MODELO || 'gemini-2.5-flash' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python -m src.main

      - name: Resumo da execução
        if: always()
        run: |
          # Mostra na tela do Actions quem escreveu a narrativa — é a forma
          # mais rápida de notar que a IA caiu e o boletim saiu degradado.
          {
            echo "## Boletim de $(date -u +'%d/%m/%Y')"
            echo ""
            if [ -f docs/index.html ]; then
              echo "- **Manchete:** $(grep -oP '(?<=<p class="manchete">).*?(?=</p>)' docs/index.html | head -1)"
              echo "- **Narrativa por:** $(grep -oP '(?<=Narrativa gerada por: ).*?(?= ·)' docs/index.html | head -1)"
            else
              echo "- Nenhum boletim foi gerado."
            fi
            if [ -f dados/historico.csv ]; then
              echo "- **Histórico:** $(($(wc -l < dados/historico.csv) - 1)) linhas acumuladas"
            fi
            echo ""
            echo "[Ver boletim publicado](https://beatrizbramont.github.io/Boletim-Macro-Commodities/)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar alterações
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs dados
          if git diff --staged --quiet; then
            echo "Nada mudou — nenhum commit criado."
          else
            git commit -m "Boletim de $(date -u +'%Y-%m-%d')"
            # O push pode colidir com um commit manual feito no intervalo.
            git pull --rebase --autostash origin ${GITHUB_REF_NAME}
            git push
          fi
